<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpaceDoctor Focus v3 — Demo</title>
<style>
:root{
  --canvas:#16181D;--nav:#1B1E24;--card:#232730;--raised:#2C313C;--text:#F5F7FA;--text2:#C2CAD6;
  --primary:#1555B6;--accent:#86B7FF;--series2:#63D5C6;--focus:#9BC9FF;--border:#414957;--border-i:#7D899B;
  --amber:#F6CB66;--red:#FF6B61;--badge:#B3261E;--neutral:#8FD3E8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
h1,h2,h3,h4,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:24px;height:24px;flex:none;display:inline-block;vertical-align:middle}
.ico svg{width:100%;height:100%;display:block}

.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{background:var(--nav);border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:block;width:176px;height:60px;object-fit:contain;object-position:left center;margin:0 0 16px 4px}
.account{display:flex;gap:12px;align-items:center;padding:8px 6px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
.account .ico{width:44px;height:44px;color:var(--text2)}
.account b{display:block;font-size:17px}
.account span{color:var(--text2);font-size:14px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 12px;border-radius:10px;color:var(--text);text-decoration:none;border-left:4px solid transparent}
.nav a:hover{background:var(--raised)}
.nav a[aria-current="page"]{background:#22385c;border-left-color:var(--accent);font-weight:600}
.rail-foot{margin-top:20px;padding:12px 6px 0;border-top:1px solid var(--border);color:var(--text2);font-size:13px}
.rail-foot button{margin-top:8px}

.main{padding:20px 24px 140px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:16px}
.topbar h1{font-size:30px;line-height:1.2;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.topbar .sub{color:var(--text2);margin-top:2px}
.top-right{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.status{font-size:14px;color:var(--text2)}
.status b{display:block;color:var(--text);font-size:15px}
.status b::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--neutral);margin-right:8px}
.pill{display:inline-block;white-space:nowrap;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:13px;font-weight:700;letter-spacing:.04em}
.pill.neutral{border-color:var(--neutral);color:var(--neutral)}
.pill.amber{border-color:var(--amber);color:var(--amber)}

.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--border-i);background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--primary);border-color:var(--primary);font-weight:600}
.btn.primary:hover{background:#1a63d0}
.btn.outline{border-color:var(--accent);color:var(--accent);font-weight:600}
.btn.urgent{border:2px solid var(--red);color:var(--red);font-weight:700}
.btn.small{min-height:44px;padding:4px 12px;font-size:14px}
.btn.link{border:0;padding:4px 6px;color:var(--accent)}

.attention{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.att{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border:1px solid var(--amber);background:#2b2616;border-radius:10px;padding:8px 14px}
.att.none{border-color:var(--border);background:var(--card);color:var(--text2)}
.att .mark{color:var(--amber);font-weight:700}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.c4{grid-column:span 4}.c6{grid-column:span 6}.c12{grid-column:span 12}
.card-head{display:flex;gap:12px;align-items:flex-start}
.card-head .ico{width:32px;height:32px;color:var(--accent);margin-top:2px}
.card-head h2{font-size:22px;line-height:1.25}
.card-head p{color:var(--text2);font-size:15px}
.big{font-size:32px;font-weight:700;line-height:1.15}
.big small{font-size:18px;font-weight:600;color:var(--text2)}
.muted{color:var(--text2)}
.small{font-size:14px}
.warn{color:var(--amber);font-weight:600}
.accentc{color:var(--series2);font-weight:700}
.note{display:flex;gap:8px;align-items:flex-start;color:var(--text2);font-size:14px}
.card-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;color:var(--text2);font-size:14px}
.card-foot .acts{display:flex;gap:8px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-top:1px solid var(--border);padding-top:10px}
.tile{font-size:13px;color:var(--text2)}
.tile b{display:block;color:var(--text);font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border-i);border-radius:8px;padding:6px 10px;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.chip .ico{width:20px;height:20px;color:var(--accent)}
.bar{height:22px;border-radius:11px;background:var(--raised);position:relative;overflow:hidden;border:1px solid var(--border)}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:11px}
.bar.s2>i{background:var(--series2)}
.bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#0d1117;mix-blend-mode:normal}
.barrow{display:grid;grid-template-columns:110px minmax(0,1fr) 200px;gap:10px;align-items:center}
.barrow b{font-size:15px}
.barrow .v{text-align:right;font-size:14px}
.scale{display:flex;justify-content:space-between;position:relative;margin:6px 8px 0}
.scale::before{content:"";position:absolute;left:10px;right:10px;top:9px;height:2px;background:var(--accent)}
.scale div{position:relative;text-align:center;font-size:13px;color:var(--text2);width:40px}
.scale i{display:block;width:20px;height:20px;border-radius:50%;border:2px solid var(--text);background:var(--card);margin:0 auto 4px}
.scale .on i{background:var(--series2);border-color:var(--series2);box-shadow:0 0 0 3px rgba(99,213,198,.3)}
.chart{width:100%;max-width:640px;height:auto;display:block}
.chart text{fill:var(--text2);font-size:12px}
.chart .axis{stroke:var(--border-i);stroke-width:1}
.chart .gridl{stroke:var(--border);stroke-width:1}
details.alt{font-size:13px;color:var(--text2)}
details.alt summary{cursor:pointer;min-height:32px;display:flex;align-items:center;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--text2);font-weight:600}
.tablewrap{overflow-x:auto}
.strike{text-decoration:line-through;color:var(--text2)}

.page-head{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.page-head .ico{width:40px;height:40px;color:var(--accent)}
.sec h3{font-size:20px;display:flex;gap:10px;align-items:center}
.sec h3 .ico{color:var(--accent)}
.sec h3 code{font-size:12px;color:var(--text2);border:1px solid var(--border);border-radius:6px;padding:1px 6px;font-family:inherit}
.sec>p.desc{color:var(--text2);font-size:14px}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end;background:var(--raised);border-radius:12px;padding:14px}
form.f label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--text2)}
form.f input,form.f select,form.f textarea{min-height:44px;background:var(--canvas);border:1px solid var(--border-i);border-radius:8px;padding:8px 10px;color:var(--text);width:100%}
form.f .wide{grid-column:1/-1}
form.f .acts{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--red);font-size:14px;font-weight:600;grid-column:1/-1}
.ok{color:var(--series2);font-size:14px;font-weight:600}
.empty{border:1px dashed var(--border-i);border-radius:10px;padding:12px 14px;color:var(--text2);font-size:15px}
.item{border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.item.amber{border-color:var(--amber)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.strip{position:relative;height:36px;background:var(--raised);border-radius:8px;border:1px solid var(--border);overflow:hidden}
.strip i{position:absolute;top:4px;bottom:4px;background:var(--accent);border-radius:4px;min-width:3px}
.strip i.nap{background:var(--series2)}
.strip-ax{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-top:4px}

.launcher{position:fixed;right:24px;bottom:24px;width:136px;height:84px;background:var(--primary);border:1px solid var(--accent);border-radius:16px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:14px;line-height:1.2;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.launcher:hover{background:#1a63d0}
.launcher .ico{width:30px;height:30px}
.badge{position:absolute;top:-10px;right:-8px;min-width:26px;height:26px;border-radius:13px;background:var(--amber);color:#16181D;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px;border:2px solid var(--canvas)}
.badge.urgent{background:var(--badge);color:#fff}
.panel{position:fixed;right:24px;bottom:24px;top:24px;width:450px;max-width:calc(100vw - 32px);background:var(--nav);border:1px solid var(--border-i);border-radius:16px;z-index:40;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.panel-head{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.panel-head h2{font-size:19px;display:flex;gap:10px;align-items:center}
.panel-body{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px;flex:1}
.panel-foot{padding:12px 16px;border-top:1px solid var(--border)}
.panel-foot form{display:flex;gap:8px}
.panel-foot input{flex:1;min-height:44px;background:var(--canvas);border:1px solid var(--border-i);border-radius:8px;padding:8px 10px;color:var(--text);min-width:0}
.paths{display:grid;gap:8px}
.paths .btn{justify-content:flex-start;text-align:left;width:100%}
.ctx{font-size:13px;color:var(--text2);background:var(--raised);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.bubble{background:var(--raised);border-radius:10px;padding:10px 12px;font-size:15px}
.bubble.me{background:#22385c;align-self:flex-end}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--card);border:2px solid var(--red);border-radius:16px;max-width:560px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.dialog.plain{border:1px solid var(--border-i)}
.dialog h2{font-size:24px;display:flex;gap:10px;align-items:center}
.foot-note{color:var(--text2);font-size:13px;margin-top:20px}

@media (max-width:1250px){.c4,.c6{grid-column:span 6}.c4.last{grid-column:span 12}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border)}
  .nav{flex-direction:row;overflow-x:auto}
  .nav a{white-space:nowrap;border-left:0;border-bottom:4px solid transparent}
  .nav a[aria-current="page"]{border-bottom-color:var(--accent)}
  .rail-foot{display:none}
  .c4,.c6,.c4.last{grid-column:span 12}
  .main{padding:16px 14px 140px}
  .launcher{right:16px;bottom:16px}
  .panel{right:0;left:0;top:0;bottom:0;width:auto;max-width:none;border-radius:0}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .barrow{grid-template-columns:90px minmax(0,1fr)}
  .barrow .v{grid-column:1/-1;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

</style>
</head>

window.SD_FEATURES={"D01":{"title":"Personal Health Dashboard","group":"System","description":"First page after demo entry or sign-in. Exactly five panels for the five retained workflows, attention items, mission time, freshness and direct links. Only the active visualization registry may render. No medication panel or aggregate health score."},"S01":{"title":"Personal baselines","group":"Shared","description":"Store baseline period, method, mission phase, approver and version. Compare only compatible observations. Keep personal baselines separate from clinical ranges and prescribed targets; never silently learn a worsening trend as normal."},"S02":{"title":"Data provenance","group":"Shared","description":"Every record retains subject, event time, received time, source, method, original units and measured/reported/estimated/simulated status. Show provenance beside values and in details; preserve original data when converting units."},"S03":{"title":"Quality and uncertainty","group":"Shared","description":"Show missing, stale, rejected and conflicting data distinctly. Never substitute zero or infer health from absence. Record quality reasons and verification steps; uncertain estimates must remain visibly estimated."},"S04":{"title":"Approved guidance","group":"Shared","description":"Use versioned reviewed guidance for retained measurements, approved urgent access and available support resources. Show source, applicability and review date. Missing content remains unavailable; do not invent procedures."},"S05":{"title":"Accessible interaction","group":"Shared","description":"Provide keyboard operation, clear focus, readable text, labeled controls, text alternatives to charts and status words beside colors. Provide reduced motion and support zoom without hiding clinical controls."},"S06":{"title":"Privacy controls","group":"Shared","description":"Enforce subject, role and consent permissions on the server and offline cache. Separate private behavioral information from operational summaries. Show recipients before sharing and audit exceptional access."},"S07":{"title":"Offline continuity","group":"Shared","description":"Keep authorized cached records and approved guides available, queue edits with unique identifiers and show last synchronization. Preserve conflicting versions for review; queued data are not yet received or clinically reviewed."},"S08":{"title":"Version and audit history","group":"Shared","description":"Retain original, corrected and superseded records with actor, reason and effective time. Recompute dependent summaries and mark changed recommendations. Audit entries are append-only and access controlled."},"S09":{"title":"Urgent access","group":"Shared","description":"Provide a persistent urgent-assistance route independent of chat and routine forms. Open approved mission procedures and assistance channels immediately. Document a separate operational fallback when the application is unavailable."},"S10":{"title":"Shared records","group":"Shared","description":"Reuse permission-checked observations, symptom records, read-only plans, concern episodes and follow-up records across the retained workflows. Reuse identical exercise/vital observations without duplicate clinical events. No removed care/medication/consultation entities."},"M01F01":{"title":"Vital-sign collection","group":"W01","description":"Provide manual entry and validated imports for prescribed heart rate, blood pressure, respiratory rate, temperature and oxygen saturation measurements. Capture units, time, device, method and conditions. Save a reviewable observation; sensors are optional integrations, not assumed hardware."},"M01F02":{"title":"Baseline comparison","group":"W01","description":"Display current value, applicable comparison band and personal trend. Explain low, within-range and high using the configured comparator. Show Reference not configured when absent; a personal baseline alone cannot establish clinical safety."},"M01F03":{"title":"Measurement-quality checks","group":"W01","description":"Check identity, units, device flags, completeness, timestamps and method. Route suspect readings to verification with a reason. Keep symptoms and urgent-assistance access available even when a reading is rejected."},"M01F04":{"title":"Routine reminders","group":"W01","description":"Show approved schedule and due, completed, deferred or declined state. Link completion to an actual valid measurement or explicit task confirmation. Assign an owner and review time to unresolved tasks."},"M01F05":{"title":"Prioritized alerts","group":"W01","description":"Show rule-based concerns ordered by urgency, with triggering observations, source and next action. Deduplicate repeated readings within the same episode. Acknowledging an alert never resolves its health issue."},"M01F06":{"title":"Urgent guidance","group":"W01","description":"Open the applicable approved assistance procedure from any concerning symptom or urgent action. Show equipment and training prerequisites and locally available instructions. Never wait for an AI response before showing the procedure."},"M01F07":{"title":"Follow-up tracking","group":"W01","description":"Track issue, assigned owner, next review, action and outcome. Allow pending, in progress and reviewed states. Require evidence or an authorized documented decision to close an actionable episode."},"M16F01":{"title":"Pain tracking","group":"W01","description":"Capture location, onset, duration, chosen scale, severity and change over time. Link reports to an episode and activity. Do not compare incompatible scales or convert an unreported pain score to zero."},"M06F01":{"title":"Sleep diaries","group":"W02","description":"Record actual sleep and wake intervals, uncertainty and subjective quality. Permit corrections and distinguish time in bed from sleep. Retain the source for self-report versus wearable estimates."},"M06F03":{"title":"Split sleep and naps","group":"W02","description":"Allow multiple sleep periods across a mission day. Union overlapping intervals to prevent double counting; retain original entries and explain any overlap resolution before saving."},"M06F05":{"title":"Fatigue check-in","group":"W02","description":"Optional named fatigue scale with event time and uncertainty. Mood belongs only to the retained Well-being check-in. Skipping remains unknown, never an abnormal result."},"M46F03":{"title":"Sleep target comparison","group":"W02","description":"Compare obtained sleep, including naps, against an externally authorized duration target for the same reporting window. Show completeness and plan version. No duty-schedule planner, circadian model or rest rescheduling."},"M08F03":{"title":"Fluid tracking","group":"W03","description":"Log consumed fluid amount, type, unit and time with correction controls. Show intake against an authorized plan when available. Fluid intake alone must not be labeled measured hydration status."},"M08F04":{"title":"Appetite observations","group":"W03","description":"Record appetite category, change, eating barriers and an optional note. Persistent concerns may enter the shared follow-up path. There is no food-intake or nutrient-calculation module."},"M08F06":{"title":"Authorized fluid target","group":"W03","description":"Display a read-only authorized fluid-intake target or band with units, reporting window, source, effective time and version. This reduced feature excludes energy, protein and other nutrient targets, goal recommendation and target-editing UI."},"M09F01":{"title":"Exercise plan","group":"W04","description":"Display an externally authorized read-only activity plan with duration, instructions, limits, review date and version. There is no in-app prescription or adjustment editor. Detailed equipment configuration is excluded."},"M09F02":{"title":"Actual exercise sessions","group":"W04","description":"Record performed activity, start/end, actual duration and complete/partial/interrupted status. Compare like activity durations with the plan effective at that time. Detailed workload and equipment-setting capture are removed."},"M09F04":{"title":"Physiological response","group":"W04","description":"Link permitted measurements to pre-exercise, exercise and recovery timing. Display method and quality. Never evaluate an exercise reading against a resting threshold without a valid context match."},"M09F05":{"title":"Pain and exertion reports","group":"W04","description":"Record perceived exertion and pain as separate named scales. Pain uses the same symptom record as Vitals. No separate functional-ability assessment or fitness-for-duty score."},"M09F06":{"title":"Recovery observations","group":"W04","description":"Record post-session symptoms, subjective recovery and compatible follow-up readings. No readiness score, recovery prediction or automatic plan adjustment."},"M23F01":{"title":"Voluntary check-ins","group":"W05","description":"Offer optional self-reports with a visible privacy statement and skip control. Show personal trends only for comparable structured responses. Avoid universal healthy mood bands or inferred emotional states."},"M23F02":{"title":"Support options","group":"W05","description":"Show a small configured list of reviewed support resources or contact routes with availability and privacy information. Let the user select or explicitly open a configured route. No support-agreement editor, case-management queue, delivery tracking or benefit/burden review."},"A01":{"title":"SpaceDoctor Assistant","group":"System","description":"Persistent contextual assistant for the retained scope only: deterministic chart explanations, recommendation history, approved urgent guides, feature help and capability limits. Optional server-side AI explains permitted evidence. It cannot restore removed features, diagnose, create clinical policies, prescribe, or send messages automatically."}};
window.SD_VIZ=[{"id":"V01","title":"Heart-rate trend","workflow_id":"W01","feature_ids":["M01F01","M01F02"],"type":"line","placement":"dashboard and detail","unit":"bpm","rules":"Separate resting and exercise context. Baseline band only when configured and compatible."},{"id":"V02","title":"Blood pressure","workflow_id":"W01","feature_ids":["M01F01","M01F02"],"type":"paired values; two-series line in detail","placement":"dashboard and detail","unit":"mmHg","rules":"Label systolic and diastolic separately. Use one compatible pressure axis."},{"id":"V03","title":"Respiratory rate","workflow_id":"W01","feature_ids":["M01F01","M01F02"],"type":"value; line in detail","placement":"dashboard and detail","unit":"breaths/min","rules":"Independent axis and reference configuration."},{"id":"V04","title":"Temperature","workflow_id":"W01","feature_ids":["M01F01","M01F02"],"type":"value; line in detail","placement":"dashboard and detail","unit":"degC","rules":"Display measurement method and compatible comparator."},{"id":"V05","title":"Oxygen saturation","workflow_id":"W01","feature_ids":["M01F01","M01F02"],"type":"value; line in detail","placement":"dashboard and detail","unit":"%","rules":"Show quality and source. SpO2 alone cannot establish complete health status."},{"id":"V06","title":"Pain reports","workflow_id":"W01","feature_ids":["M16F01"],"type":"timestamped score/location; trend only for same scale","placement":"detail","unit":"named pain scale","rules":"No missing-to-zero conversion or functional-ability score."},{"id":"V07","title":"Obtained sleep vs target","workflow_id":"W02","feature_ids":["M06F01","M06F03","M46F03"],"type":"daily bars and configured target line","placement":"dashboard and detail","unit":"hours","rules":"Exact closed reporting windows and completeness status. Naps included once."},{"id":"V08","title":"Sleep intervals","workflow_id":"W02","feature_ids":["M06F01","M06F03"],"type":"sleep/nap interval strip","placement":"detail","unit":"explicit missio (function (root) {
  'use strict';
  var MIN = 60000;

  function ms(iso) { return new Date(iso).getTime(); }

  /* Union sleep intervals, clipped to a reporting window. Overlapping minutes count once. */
  function unionMinutes(intervals, winStart, winEnd) {
    var ws = ms(winStart), we = ms(winEnd), raw = 0;
    var clipped = [];
    intervals.forEach(function (iv) {
      var s = Math.max(ms(iv.start), ws), e = Math.min(ms(iv.end), we);
      if (e > s) { clipped.push([s, e]); raw += e - s; }
    });

    clipped.forEach(function (c) {
      var last = merged[merged.length - 1];

      else merged.push([c[0], c[1]]);
    });

    return {
      minutes: Math.round(total / MIN),
      overlapMinutes: Math.round((raw - total) / MIN),
      merged: merged
    };
  }

  /* PERIOD rule: only a closed and complete window can be compared with a target. */
  function sleepSummary(intervals, win, target, nowIso) {
    var u = unionMinutes(intervals, win.start, win.end);
    var closed = ms(win.end) <= ms(nowIso);
    var out = { obtained: u.minutes, overlapMinutes: u.overlapMinutes, closed: closed, complete: !!win.complete, state: 'IN_PROGRESS', shortfall: null };
    if (!closed) out.state = 'IN_PROGRESS';

      '<div class="chips"><span class="chip">' + ico('M06F05') + 'Fatigue: ' + (fat ? '<b>' + FATIGUE[fat.value] + '</b> (' + fat.value + ' of 5)' : 'no check-in recorded') + '</span><span class="chip">' + ico('M06F03') + (napMin ? 'Nap included: <b>' + napMin + ' min</b>' : 'No nap in this window') + '</span></div>' +

  function sessionBars(list) {

        '<span class="v">' + x.performed + (x.planned ? ' / ' + x.planned : '') + ' min' + (pct !== null ? ' · ' + pct + '%' : '') + ' · ' + esc(x.status) + '</span></div>';
    }).join('');
  }
  function recoveryChart(sessionId) {

    return lineChart({ title: 'Heart rate after the session, in beats per minute', unit: 'bpm', xLabel: 'Minutes after session', yLabel: 'bpm', pad: 2,

  }
  function panelExercise() {
    var day = lastSessionDay(), lastS = day[day.length - 1], ex = latestOf(S.exertion), pn = latestOf(S.pain);
    var linked = S.sessions.slice().reverse().filter(function (x) { return S.obs.some(function (o) { return o.sessionId === x.id; }); })[0];
    return '<section class="card c6"><div class="card-head">' + ico('W04') + '<div><h2>Exercise &amp; Recovery</h2><p>Completed activity against the demo plan</p></div></div>' + sessionBars(day) +
      '<div><b>Recovery heart rate</b>' + (linked ? ' <span class="muted small">(' + esc(linked.activity) + ' session)</span>' : '') + '</div>' + (linked ? recoveryChart(linked.id) : '<div class="empty">No linked readings.</div>') +
      '<div class="chips"><span class="chip">' + ico('M09F05') + 'Exertion: ' + (ex ? '<b>' + ex.value + ' / 10</b>' : 'not reported') + '</span><span class="chip">' + ico('M16F01') + 'Pain: ' + (pn ? (pn.score === null ? 'reported, no score' : '<b>' + pn.score + ' / 10</b>') : 'no report') + '</span></div>' +

      '<p class="muted" style="text-align:center">Shared only through an explicit choice. There is no “normal” mood band.</p>' +
      '<div class="row" style="justify-content:center"><a class="btn outline" href="#wellbeing" data-goto="f-M23F01">New check-in</a><a class="btn outline" href="#wellbeing" data-goto="f-M23F02">View support options</a></div>' +

  /* ---------- vitals ---------- */
  function obsTable() {
    var rows = S.obs.slice().sort(function (a, b) { return ms(b.observed_at) - ms(a.observed_at); }).slice(0, 40).map(function (o) {
      var rej = o.quality === 'REJECTED', acts = '';

        return '<tr><td colspan="8"><form class="f" data-form="obs-correct" data-id="' + o.id + '" novalidate><label>Corrected value (' + esc(unitLabel(o.unit)) + ')<input name="value" type="number" step="any" value="' + o.value + '"></label><label>Reason<input name="reason" placeholder="Why is it corrected?"></label><p class="err" role="alert"></p><div class="acts"><button class="btn primary">Save correction</button><button type="button" class="btn" data-act="cancel-edit">Cancel</button></div></form></td></tr>';
      }
      if (ui.edit && ui.edit.id === o.id && ui.edit.type === 'unrel') {
        return '<tr><td colspan="8"><form class="f" data-form="obs-unrel" data-id="' + o.id + '" novalidate><label class="wide">Reason this reading is unreliable<input name="reason" placeholder="e.g. sensor slipped"></label><p class="err" role="alert"></p><div class="acts"><button class="btn primary">Mark unreliable</button><button type="button" class="btn" data-act="cancel-edit">Cancel</button></div></form></td></tr>';
      }
      if (!rej) acts = '<button class="btn small" data-act="edit" data-type="obs" data-id="' + o.id + '">Correct</button> <button class="btn small" data-act="edit" data-type="unrel" data-id="' + o.id + '">Mark unreliable</button>' + (o.quality === 'NEEDS_VERIFICATION' ? ' <button class="btn small" data-act="obs-verify" data-id="' + o.id + '">Verify</button>' : '');
      var q = o.quality === 'VALID' ? 'Valid' : o.quality === 'NEEDS_VERIFICATION' ? '<span class="warn">Needs verification</span>' : '<span class="muted">Unreliable</span>';
      return '<tr><td>' + fmt(o.observed_at) + '</td><td>' + esc(STORED[o.metric] || o.metric) + '</td><td class="' + (rej ? 'strike' : '') + '"><b>' + o.value + '</b> ' + esc(unitLabel(o.unit)) + (o.original ? '<br><span class="muted small">entered as ' + esc(o.original) + '</span>' : '') + '</td><td>' + esc(o.context) + (o.sessionId ? '<br><span class="muted small">' + esc(sessionLabel(o.sessionId)) + '</span>' : '') + '</td><td>' + esc(o.source) + ' / ' + esc(o.method) + '</td><td>' + q + (o.qualityReason ? '<br><span class="muted small">' + esc(o.qualityReason) + '</span>' : '') + '</td><td>' + o.revision + (o.history.length ? '<br><span class="muted small">was ' + esc(o.history.map(function (h) { return h.value; }).join(', ')) + '</span>' : '') + '</td><td>' + acts + '</td></tr>';
    }).join('');
    return '<div class="tablewrap"><table><tr><th>Time</th><th>Measurement</th><th>Value</th><th>Context</th><th>Source / method</th><th>Quality</th><th>Rev.</th><th>Actions</th></tr>' + rows + '</table></div>';
  }
  function trend() {
    var m = ui.metric, def = METRICS[m], ctx = ui.ctxFilter, ser;
    function pts(metric) { return series(metric, ctx).map(function (o) { return { x: ms(o.observed_at), y: o.value, xl: hm(o.observed_at), tl: fmt(o.observed_at) }; }); }
    if (m === 'blood_pressure') ser = [{ name: 'Systolic', color: '#86B7FF', points: pts('blood_pressure_systolic') }, { name: 'Diastolic', color: '#63D5C6', points: pts('blood_pressure_diastolic') }];
    else ser = [{ name: def.label, color: '#86B7FF', points: pts(m) }];
    var sel = '<div class="row"><label class="small muted">Measurement <select data-change="metric" style="min-height:44px;background:#16181D;border:1px solid #7D899B;border-radius:8px;padding:6px 10px;color:#F5F7FA">' + Object.keys(METRICS).map(function (k) { return '<option value="' + k + '"' + (k === m ? ' selected' : '') + '>' + METRICS[k].label + '</option>'; }).join('') + '</select></label>' +
      '<label class="small muted">Context <select data-change="ctx" style="min-height:44px;background:#16181D;border:1px solid #7D899B;border-radius:8px;padding:6px 10px;color:#F5F7FA">' + ['rest', 'exercise', 'recovery'].map(function (c) { return '<option' + (c === ctx ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></label><button class="btn small" data-act="explain" data-viz="' + def.viz + '">Explain this chart</button></div>';
    return sel + lineChart({ title: def.label + ' trend, ' + ctx + ' context', unit: unitLabel(def.unit), xLabel: 'Time (UTC)', yLabel: unitLabel(def.unit), pad: m === 'temperature' ? 0.2 : 2, series: ser }) +
      '<p class="note"><span class="pill neutral">Reference not configured</span><span>No approved reference range or personal baseline is loaded. Readings from different contexts are never mixed on one line.</span></p>';
  }
  function followups() {
    var list = S.followups.map(function (f) {
      var closing = ui.edit && ui.edit.id === f.id && ui.edit.type === 'fu-close';
      return '<div class="item"><div class="row"><span class="pill ' + (f.status === 'closed' ? 'neutral' : 'amber') + '">' + esc(f.status.toUpperCase()) + '</span><b>' + esc(f.subject) + '</b></div><p class="small">Action: ' + esc(f.action || '—') + ' · Owner: ' + esc(f.owner) + ' · Review by ' + fmt(f.due) + '</p>' +

      sec('M01F03', ver.length ? ver.map(function (o) { return '<div class="item amber"><b>' + esc(STORED[o.metric]) + ' ' + o.value + ' ' + esc(unitLabel(o.unit)) + ' · ' + fmt(o.observed_at) + '</b><p class="small">' + esc(o.qualityReason) + ' It is kept visible but cannot create a confirmed low or high finding. Use Verify or Mark unreliable in the table above.</p></div>'; }).join('') : '<div class="empty">No readings are waiting for verification.</div>') +
      sec('M01F04', '<div class="empty">No approved measurement schedule is configured in this demo, so there are no reminders to show.</div>') +
      sec('M01F05', recs + '<p class="muted small">Only the demo sleep-target review can appear here. Real alert thresholds are not supplied, so vital signs are never classified.</p>') +
      sec('M01F06', '<div class="row"><button class="btn urgent" data-act="urgent">' + ico('S09') + 'Urgent assistance</button><span class="muted small">Opens straight away, without the Assistant and without any sensor reading.</span></div>') +
      sec('M01F07', followups()) +

  /* ---------- sleep ---------- */
  function strip(w) {
    var a = ms(w.start), span = ms(w.end) - a, h = '';
    w.items.forEach(function (iv) {
      var s = Math.max(ms(iv.start), a), e = Math.min(ms(iv.end), ms(w.end));
      h += '<i class="' + (iv.kind === 'nap' ? 'nap' : '') + '" style="left:' + ((s - a) / span * 100) + '%;width:' + ((e - s) / span * 100) + '%" title="' + esc(iv.kind + ' ' + hm(iv.start) + '–' + hm(iv.end)) + '"></i>';
    });
    return '<div class="strip" role="img" aria-label="Sleep and nap intervals in this window">' + h + '</div><div class="strip-ax"><span>12:00</span><span>18:00</span><span>00:00</span><span>06:00</span><span>12:00 UTC</span></div>';
  }
  function pageSleep() {
    var wins = sleepWindows().slice().reverse();
    var cards = wins.map(function (w) {
      var s = w.sum, st;
      if (s.state === 'IN_PROGRESS') st = '<span class="pill neutral">In progress</span> <span class="muted small">Open window: no target comparison yet.</span>';
      else if (s.state === 'CLOSED_NOT_ATTESTED') st = '<span class="pill neutral">Closed, not marked complete</span> <button class="btn small" data-act="win-complete" data-id="' + w.start + '">Mark period complete</button>';
      else if (s.state === 'BELOW_TARGET') st = '<span class="pill amber">Review</span> <span class="warn">' + L.fmtDuration(s.shortfall) + ' below demo target</span>';

      else st = '<span class="pill neutral">Target not configured</span>';
      return '<div class="item"><div class="row"><b>' + fmt(w.start) + ' → ' + fmt(w.end) + '</b></div><div class="row"><span class="big" style="font-size:24px">' + L.fmtDuration(s.obtained) + '</span><span class="muted">obtained of ' + L.fmtDuration(S.sleepTarget.minutes) + ' target</span></div><div class="row">' + st + '</div>' + strip(w) +
        (s.overlapMinutes ? '<p class="small muted">' + ico('M06F03') + ' ' + s.overlapMinutes + ' overlapping minutes were counted once.</p>' : '') + '</div>';
    }).join('');
    var form = '<form class="f" data-form="sleep" novalidate><label>Type<select name="kind"><option value="sleep">Sleep</option><option value="nap">Nap</option></select></label><label>Fell asleep (UTC)<input name="start" type="datetime-local" value="' + toInput(addMin(NOW, -60)) + '"></label><label>Woke up (UTC)<input name="end" type="datetime-local" value="' + toInput(NOW) + '"></label><label>Source<select name="source"><option>self-report</option><option>wearable estimate</option></select></label><p class="err" role="alert"></p><div class="acts wide"><button class="btn primary">Log sleep</button><span class="muted small">Enter actual sleep, not time in bed.</span></div></form>';
    var rows = S.sleep.slice().sort(function (a, b) { return ms(b.start) - ms(a.start); }).map(function (iv) {
      if (ui.edit && ui.edit.id === iv.id) return '<tr><td colspan="6"><form class="f" data-form="sleep-edit" data-id="' + iv.id + '" novalidate><label>Fell asleep (UTC)<input name="start" type="datetime-local" value="' + toInput(iv.start) + '"></label><label>Woke up (UTC)<input name="end" type="datetime-local" value="' + toInput(iv.end) + '"></label><label>Reason<input name="reason"></label><p class="err" role="alert"></p><div class="acts"><button class="btn primary">Save interval</button><button type="button" class="btn" data-act="cancel-edit">Cancel</button></div></form></td></tr>';
      return '<tr><td>' + esc(iv.kind) + '</td><td>' + fmt(iv.start) + '</td><td>' + fmt(iv.end) + '</td><td>' + L.fmtDuration(Math.round((ms(iv.end) - ms(iv.start)) / 60000)) + '</td><td>' + esc(iv.source) + ' · rev. ' + iv.revision + '</td><td><button class="btn small" data-act="edit" data-type="sleep" data-id="' + iv.id + '">Edit interval</button></td></tr>';
    }).join('');
    var fat = S.fatigue.slice().sort(function (a, b) { return ms(b.time) - ms(a.time); });
    var fform = '<form class="f" data-form="fatigue" novalidate><label>How tired are you? (demo fatigue scale 1–5)<select name="value">' + [1, 2, 3, 4, 5].map(function (i) { return '<option value="' + i + '">' + i + ' — ' + FATIGUE[i] + '</option>'; }).join('') + '</select></label><label>Time (UTC)<input name="time" type="datetime-local" value="' + toInput(NOW) + '"></label><p class="err" role="alert"></p><div class="acts"><button class="btn primary">Record fatigue</button><button type="button" class="btn" data-act="skip" data-what="Fatigue check-in">Skip</button></div></form>';
    return '<div class="grid">' +
      sec('M46F03', flash() + sleepBars(wins.filter(function (w) { return w.sum.closed && w.complete; }).reverse().slice(-7), S.sleepTarget) + cards + '<p class="muted small">Target: ' + L.fmtDuration(S.sleepTarget.minutes) + ' per 24-hour window · ' + esc(S.sleepTarget.source) + ' · version ' + esc(S.sleepTarget.version) + ' · read-only. <button class="btn link" data-act="explain" data-viz="V07">Explain</button></p>') +
      sec('M06F01', form + '<div class="tablewrap"><table><tr><th>Type</th><th>Start</th><th>End</th><th>Length</th><th>Source</th><th></th></tr>' + rows + '</table></div>') +
      sec('M06F03', '<p class="small">Add naps with the form above (Type: Nap). Totals join overlapping entries so no minute is counted twice, and your original entries are kept as entered. Example: a 60-minute and a 30-minute entry that share 30 minutes total 60 minutes.</p>') +
      sec('M06F05', fform + (fat.length ? '<div class="tablewrap"><table><tr><th>Time</th><th>Rating</th><th>Scale</th></tr>' + fat.map(function (f) { return '<tr><td>' + fmt(f.time) + '</td><td>' + f.value + ' — ' + FATIGUE[f.value] + '</td><td>demo fatigue scale 1–5</td></tr>'; }).join('') + '</table></div>' : '<div class="empty">No fatigue check-in recorded. A skipped check-in stays unknown and never raises a concern.</div>')) + auditBlock() + '</div>';
  }

  /* ---------- hydration ---------- */
  function pageHydration() {
    var f = fluidToday(), t = S.fluidTarget;
    var form = '<form class="f" data-form="fluid" novalidate><label>Drink<select name="type"><option>Water</option><option>Juice</option><option>Tea or coffee</option><option>Electrolyte drink</option><option>Other</option></select></label><label>Amount<input name="value" type="number" step="any" min="0" inputmode="decimal"></label><label>Unit<select name="unit"><option>mL</option><option>L</option><option>US fl oz</option></select></label><label>Time (UTC)<input name="time" type="datetime-local" value="' + toInput(NOW) + '"></label><p class="err" role="alert"></p><div class="acts wide"><button class="btn primary">Log fluid</button></div></form>';

  function answer(q) {
    var s = q.toLowerCase();

    if (/nutri|calor|protein|food|meal|body.?mass|weight/.test(s)) return 'Food, nutrient and body-mass tracking are outside SpaceDoctor Focus v3. This version logs fluids and a self-reported appetite only.';
    if (/circadian|duty|schedule|equipment/.test(s)) return 'That is outside SpaceDoctor Focus v3.';
    if (/diagnos|am i (ok|sick|ill|healthy)/.test(s)) return 'I can’t diagnose or judge your health. I can explain the records and charts on screen.';
    if (/emergenc|urgent|help me|first aid/.test(s)) return 'Use the Urgent assistance button at the top of the page. No approved procedures are loaded in this demo.';

    else if (act === 'rec-read') { var r = byId(S.recs, id); if (r && r.state === 'UNREAD') { r.state = 'READ'; save(); renderMain(); renderOverlay(); } }
    else if (act === 'rec-ack') { var r2 = byId(S.recs, id); if (r2) { r2.ack = true; if (r2.state === 'UNREAD') r2.state = 'READ'; audit('Recommendation acknowledged', r2.key); save(); renderMain(); renderOverlay(); } }
    else if (act === 'edit') { ui.edit = { type: el.getAttribute('data-type'), id: id }; renderMain(); var f = document.querySelector('#main form[data-id="' + id + '"] input'); if (f) f.focus(); }
    else if (act === 'cancel-edit') { ui.edit = null; renderMain(); }
    else if (act === 'obs-verify') { var o = byId(S.obs, id); o.quality = 'VALID'; o.qualityReason = 'Verified by ' + ACTOR; audit('Reading verified', STORED[o.metric] + ' ' + o.value); commit('Reading verified.'); }
    else if (act === 'win-complete') { S.complete[id] = true; audit('Sleep period marked complete', fmt(id)); commit('Period marked complete.'); }
    else if (act === 'fu-status') { var fu = byId(S.followups, id); fu.status = el.getAttribute('data-status'); audit('Follow-up ' + fu.status, fu.subject); commit('Follow-up updated.'); }
    else if (act === 'skip') { audit(el.getAttribute('data-what') + ' skipped', 'Recorded as unknown'); commit(el.getAttribute('data-what') + ' skipped. Nothing was recorded and no concern is raised.'); }
    else if (act === 'appetite-review') { S.followups.unshift({ id: uid('fu'), subject: 'Appetite change', action: 'Review requested by the user', owner: 'Unassigned — needs an owner', due: addMin(NOW, 1440), status: 'pending' }); audit('Appetite review requested', ''); commit('Review requested. It is listed under Follow-up tracking in Vitals & Symptoms.'); }
  });
  document.addEventListener('change', function (ev) {
    var c = ev.target.getAttribute && ev.target.getAttribute('data-change'); if (!c) return;
    if (c === 'obs-metric') syncMetricForm(ev.target);
    else if (c === 'metric') { ui.metric = ev.target.value; renderMain(); scrollTo('f-M01F02'); }
    else if (c === 'ctx') { ui.ctxFilter = ev.target.value; renderMain(); scrollTo('f-M01F02'); }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (ui.dialog) { ui.dialog = null; renderOverlay(); }
    else if (ui.asst.open) { ui.asst.open = false; renderOverlay(); var l = document.querySelector('.launcher'); if (l) l.focus(); }
  });
  function scrollTo(id) { var e = document.getElementById(id); if (e) e.scrollIntoView(); }
  function fail(form, msg) { form.querySelector('.err').textContent = msg; return false; }

  var FORMS = {
    obs: function (f, form) {
      var def = METRICS[f.metric], v = num(f.value), t = fromInput(f.time);
      if (!def) return fail(form, 'Choose a measurement.');
      if (!isFinite(v)) return fail(form, 'Enter a number for the value.');
      if (def.units.indexOf(f.unit) < 0) return fail(form, 'That unit is not supported for ' + def.label.toLowerCase() + '.');
      if (!t) return fail(form, 'Enter the time of the measurement.');
      if (ms(t) > ms(NOW) + 300000) return fail(form, 'The time is in the future on the demo clock (' + fmt(NOW) + ').');
      var parts = [], orig = null;
      if (f.metric === 'blood_pressure') {
        var d = num(f.value2);
        if (!isFinite(d)) return fail(form, 'Enter both systolic and diastolic values.');
        if (d >= v) return fail(form, 'Diastolic must be lower than systolic.');
        parts = [['blood_pressure_systolic', v, def.plaus], ['blood_pressure_diastolic', d, def.plaus2]];
      } else {
        if (f.metric === 'spo2' && (v > 100 || v < 0)) return fail(form, 'Oxygen saturation must be between 0 and 100%.');
        if (v <= 0) return fail(form, 'The value must be greater than zero.');
        if (f.unit === 'degF') { orig = v + ' °F'; v = Math.round(L.fToC(v) * 100) / 100; }
        parts = [[f.metric, v, def.plaus]];
      }
      parts.forEach(function (p) {
        var odd = p[1] < p[2][0] || p[1] > p[2][1];
        S.obs.push({ id: uid('obs'), metric: p[0], value: p[1], unit: def.unit, original: orig, observed_at: t, received_at: NOW, source: 'manual', method: f.method || 'manual entry', context: f.context,
          quality: odd ? 'NEEDS_VERIFICATION' : 'VALID', qualityReason: odd ? 'Outside the plausible entry range; please check the value and unit.' : '', revision: 1, history: [], actor: ACTOR });
        audit('Measurement saved', STORED[p[0]] + ' ' + p[1] + ' ' + unitLabel(def.unit));
      });
      return 'Measurement saved.';
    },
    'obs-correct': function (f, form) {
      var o = byId(S.obs, form.getAttribute('data-id')), v = num(f.value);
      if (!isFinite(v) || v <= 0) return fail(form, 'Enter a valid corrected value.');
      if (!f.reason.trim()) return fail(form, 'Give a reason for the correction.');
      o.history.push({ value: o.value, at: NOW, reason: f.reason }); o.value = v; o.revision += 1;
      audit('Measurement corrected', STORED[o.metric] + ' → ' + v + ' (' + f.reason + ')'); return 'Correction saved as revision ' + o.revision + '.';
    },
    'obs-unrel': function (f, form) {
      var o = byId(S.obs, form.getAttribute('data-id'));
      if (!f.reason.trim()) return fail(form, 'Give a reason.');
      o.quality = 'REJECTED'; o.qualityReason = f.reason; audit('Reading marked unreliable', STORED[o.metric] + ' ' + o.value + ' (' + f.reason + ')'); return 'Reading marked unreliable. It stays visible but is not used.';
    },
    pain: function (f, form) {
      var t = fromInput(f.time), sc = f.score === '' ? null : num(f.score);
      if (!t) return fail(form, 'Enter the time.');
      if (sc !== null && (!isFinite(sc) || sc < 0 || sc > 10 || sc % 1)) return fail(form, 'The score must be a whole number from 0 to 10, or left empty.');
      S.pain.push({ id: uid('pain'), location: f.location, scale: 'demo-0-to-10', score: sc, change: f.change, duration: f.duration, note: f.note, time: t, sessionId: f.session || null });
      audit('Pain reported', f.location + (sc === null ? ', no score' : ', ' + sc + '/10')); return 'Pain report saved.';
    },
    followup: function (f, form) {
      var due = fromInput(f.due);
      if (!f.owner.trim()) return fail(form, 'An owner is required.');
      if (!due) return fail(form, 'A review date is required.');
      S.followups.unshift({ id: uid('fu'), subject: f.subject, action: f.action, owner: f.owner, due: due, status: 'pending' });
      audit('Follow-up recorded', f.subject + ' · owner ' + f.owner); return 'Follow-up recorded.';
    },
    'fu-close': function (f, form) {
      var fu = byId(S.followups, form.getAttribute('data-id'));
      if (!f.reason.trim() || !f.author.trim()) return fail(form, 'Closing needs a reason and the name of the person authorizing it.');
      fu.status = 'closed'; fu.closeReason = f.reason; fu.closedBy = f.author; audit('Follow-up closed', fu.subject + ' · ' + f.author); return 'Follow-up closed.';
    },
    sleep: function (f, form) {
      var s = fromInput(f.start), e = fromInput(f.end);
      if (!s || !e) return fail(form, 'Enter both times.');
      if (ms(e) <= ms(s)) return fail(form, 'Wake-up time must be after the time you fell asleep.');
      if (ms(e) > ms(NOW) + 300000) return fail(form, 'That is in the future on the demo clock (' + fmt(NOW) + ').');
      if (ms(e) - ms(s) > 16 * 3600000) return fail(form, 'More than 16 hours in one entry looks wrong. Please check the times.');
      var ov = 0; S.sleep.forEach(function (iv) { ov += Math.max(0, Math.min(ms(e), ms(iv.end)) - Math.max(ms(s), ms(iv.start))); });
      ov = Math.round(ov / 60000);
      if (ov > 0 && form.getAttribute('data-ok') !== s + e) { form.setAttribute('data-ok', s + e); return fail(form, 'This overlaps an existing entry by ' + ov + ' min. Overlapping minutes are counted once and both entries are kept. Press “Log sleep” again to save.'); }
      S.sleep.push({ id: uid('sl'), start: s, end: e, kind: f.kind, source: f.source, revision: 1, history: [] });
      audit('Sleep logged', f.kind + ' ' + fmt(s) + ' → ' + fmt(e)); return 'Sleep entry saved.';
    },
    'sleep-edit': function (f, form) {
      var iv = byId(S.sleep, form.getAttribute('data-id')), s = fromInput(f.start), e = fromInput(f.end);
      if (!s || !e || ms(e) <= ms(s)) return fail(form, 'Wake-up time must be after the time you fell asleep.');
      if (!f.reason.trim()) return fail(form, 'Give a reason for the change.');
      iv.history.push({ start: iv.start, end: iv.end, reason: f.reason }); iv.start = s; iv.end = e; iv.revision += 1;
      audit('Sleep interval edited', fmt(s) + ' → ' + fmt(e) + ' (' + f.reason + ')'); return 'Interval updated. Totals were recalculated.';
    },
    fatigue: function (f, form) {
      var t = fromInput(f.time); if (!t) return fail(form, 'Enter the time.');
      S.fatigue.push({ id: uid('fat'), value: Number(f.value), time: t }); audit('Fatigue recorded', f.value + ' of 5'); return 'Fatigue check-in saved.';
    },
    fluid: function (f, form) {
      var v = num(f.value), t = fromInput(f.time), ml = L.toMl(v, f.unit);
      if (!isFinite(v) || v <= 0) return fail(form, 'Enter an amount greater than zero.');
      if (ml === null) return fail(form, 'That unit is not supported.');
      if (ml > 5000) return fail(form, 'More than 5 L in one entry looks wrong. Please check the amount and unit.');
      if (!t) return fail(form, 'Enter the time.');
      S.fluid.push({ id: uid('fl'), ml: ml, value: v, unit: f.unit, type: f.type, time: t, source: 'manual', revision: 1, history: [] });
      audit('Fluid logged', v + ' ' + f.unit + ' ' + f.type); return 'Fluid entry saved.';
    },
    'fluid-correct': function (f, form) {
      var e = byId(S.fluid, form.getAttribute('data-id')), v = num(f.value), ml = L.toMl(v, f.unit);
      if (!isFinite(v) || v <= 0 || ml === null) return fail(form, 'Enter a valid amount.');
      if (!f.reason.trim()) return fail(form, 'Give a reason for the correction.');
      e.history.push({ value: e.value, unit: e.unit, reason: f.reason }); e.value = v; e.unit = f.unit; e.ml = ml; e.revision += 1;
      audit('Fluid entry corrected', v + ' ' + f.unit + ' (' + f.reason + ')'); return 'Correction saved. The total was recalculated.';
    },
    appetite: function (f, form) {
      var t = fromInput(f.time); if (!t) return fail(form, 'Enter the time.');
      S.appetite.push({ id: uid('ap'), category: f.category, change: f.change, barriers: f.barriers, note: f.note, time: t, source: 'self-report' });
      audit('Appetite recorded', f.category); return 'Appetite report saved.';
    },
    session: function (f, form) {
      var s = fromInput(f.start), e = fromInput(f.end);
      if (!s || !e) return fail(form, 'Enter start and end times.');
      if (ms(e) <= ms(s)) return fail(form, 'The end must be after the start.');
      if (ms(e) > ms(NOW) + 300000) return fail(form, 'That is in the future on the demo clock (' + fmt(NOW) + ').');
      if (S.sessions.some(function (x) { return x.activity === f.activity && x.start === s; })) return fail(form, 'A ' + f.activity + ' session with this start time already exists.');
      var p = S.plan.filter(function (x) { return x.activity === f.activity; })[0], min = Math.round((ms(e) - ms(s)) / 60000);
      S.sessions.push({ id: uid('ex'), activity: f.activity, start: s, end: e, performed: min, planned: p ? p.minutes : 0, status: f.status, planVersion: S.planMeta.version, note: f.note });
      audit('Exercise session saved', f.activity + ' ' + min + ' min, ' + f.status); return 'Session saved: ' + min + ' minutes.';
    },
    response: function (f, form) {
      var x = byId(S.sessions, f.session), v = num(f.value), m = num(f.minute);
      if (!x) return fail(form, 'Choose a session.');
      if (!isFinite(v) || v <= 0) return fail(form, 'Enter a heart-rate value.');
      if (!isFinite(m) || m < 0) return fail(form, 'Enter the minutes after the session end.');
      var odd = v < 25 || v > 230, t = addMin(x.end, m);
      S.obs.push({ id: uid('obs'), metric: 'heart_rate', value: v, unit: 'bpm', observed_at: t, received_at: NOW, source: 'manual', method: 'manual entry', context: f.phase, quality: odd ? 'NEEDS_VERIFICATION' : 'VALID', qualityReason: odd ? 'Outside the plausible entry range; please check the value.' : '', revision: 1, history: [], sessionId: x.id, minute: m });
      audit('Exercise response recorded', v + ' bpm, ' + m + ' min after ' + x.activity); return 'Response saved and linked to the session.';
    },
    exertion: function (f, form) {
      var v = num(f.value); if (!byId(S.sessions, f.session)) return fail(form, 'Choose a session.');
      if (!isFinite(v) || v < 0 || v > 10 || v % 1) return fail(form, 'Exertion must be a whole number from 0 to 10.');
      S.exertion.push({ id: uid('exr'), sessionId: f.session, scale: 'demo-0-to-10', value: v, time: NOW }); audit('Exertion recorded', v + '/10'); return 'Exertion saved.';
    },
    recovery: function (f, form) {
      var t = fromInput(f.time); if (!byId(S.sessions, f.session)) return fail(form, 'Choose a session.'); if (!t) return fail(form, 'Enter the time.');
      S.recovery.push({ id: uid('rcv'), sessionId: f.session, state: f.state, note: f.note, time: t }); audit('Recovery logged', f.state); return 'Recovery observation saved.';
    },
    wellbeing: function (f, form) {
      var t = fromInput(f.time); if (!t) return fail(form, 'Enter the time.');
      S.wellbeing.push({ id: uid('wb'), scale: 'demo-1-to-5', value: Number(f.value), time: t }); audit('Well-being check-in', 'Private entry saved'); return 'Check-in saved. It stays private.';
    }
  };
  document.addEventListener('submit', function (ev) {
    var form = ev.target, name = form.getAttribute('data-form'); if (!name) return;
    ev.preventDefault();
    var f = {}; Array.prototype.forEach.call(form.elements, function (el) { if (el.name) f[el.name] = el.value; });
    if (name === 'ask') {
      var q = (f.q || '').trim(); if (!q) return;
      ui.asst.msgs.push({ me: true, html: esc(q) }); ui.asst.msgs.push({ html: esc(answer(q)) }); renderOverlay();
      var b = document.getElementById('asst-body'); if (b) b.scrollTop = b.scrollHeight; var i = document.querySelector('.panel-foot input'); if (i) i.focus();
      return;
    }
    var sec0 = form.closest('section'), anchor = sec0 && sec0.id;
    var msg = FORMS[name](f, form);
    if (msg) { commit(msg); if (anchor) scrollTo(anchor); }
  });

  function route() {
    var h = (location.hash || '').replace(/^#\/?/, '').toLowerCase();
    ui.route = h || 'dashboard'; ui.edit = null;
    renderMain(); renderOverlay();
    if (ui.goto) { scrollTo(ui.goto); ui.goto = null; } else window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  S = load() || seed(); syncRecs(); save();
  window.SDApp = { state: function () { return S; }, blocked: BLOCKED };
  route();
})();

</script>
